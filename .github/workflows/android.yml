name: Android
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.event_name == 'workflow_dispatch' && 'release' || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      release_name: ${{ steps.version.outputs.name }}
      release_tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check release version calculation
        run: python3 -m unittest discover -s scripts -p test_release_version.py
      - name: Choose next release version
        id: version
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/next-release-version.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v5
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./scripts/build.sh
      - uses: actions/upload-artifact@v6
        with:
          name: LumenKot-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
  publish:
    name: Publish test release
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_NAME: ${{ needs.build.outputs.release_name }}
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
    steps:
      - name: Download tested APK
        run: gh run download "$GITHUB_RUN_ID" --name LumenKot-apk --dir work/release
      - name: Create tag and publish APK
        shell: bash
        run: |
          set -euo pipefail
          asset="work/release/LumenKot-${RELEASE_NAME}.apk"
          mv work/release/app-release.apk "$asset"
          gh api "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"
          gh release create "$RELEASE_TAG" "$asset" --verify-tag --title "LumenKot $RELEASE_NAME" --generate-notes --prerelease
